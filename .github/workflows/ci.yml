name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release

      # Starts the real app (WPF + Win32 layers, which the unit tests don't cover) with simulated traffic and has it
      # exit by itself; fails on a hang, a non-zero exit code, or an ERROR line in its log. See the script for details.
      - name: Launch smoke test
        shell: pwsh
        timeout-minutes: 5
        run: ./tools/Test-LaunchSmoke.ps1 -ExitAfter 20 -TimeoutSeconds 120
